name: mate
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: mate
      MARIADB_USER: mate
      MARIADB_PASSWORD: ${DB_PASSWORD:?configure .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?configure .env}
    volumes:
      - mate-db:/var/lib/mysql
      - ./api/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1
    networks: [control]
  api:
    build: ./api
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      MATE_TOKEN: ${MATE_TOKEN}
      WORKER_TOKEN: ${WORKER_TOKEN}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 256m
    networks: [control]
  web:
    image: nginx:1.28-alpine
    ports: ['${MATE_BIND:-127.0.0.1}:${MATE_PORT:-8787}:80']
    volumes:
      - ./build/web:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 128m
    networks: [control, edge]
  worker:
    build: ./worker
    environment:
      API_URL: http://web/api
      WORKER_TOKEN: ${WORKER_TOKEN}
      MAX_CONCURRENT: ${MAX_CONCURRENT:-2}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-900}
      TASK_CPU: ${TASK_CPU:-2}
      TASK_MEMORY: ${TASK_MEMORY:-2g}
      CODEX_MODEL: ${CODEX_MODEL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.secrets:/run/mate-secrets:ro
    depends_on: [web]
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1
    networks: [control]
volumes:
  mate-db:
networks:
  control:
    internal: true
  edge:
